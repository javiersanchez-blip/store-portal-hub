<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store Portals</title>
<style>
  :root {
    --navy: #0B2340;
    --navy-deep: #081A30;
    --gold: #C9A84C;
    --gold-soft: #E9DBAE;
    --ink: #F3F5F8;
    --ink-muted: #A9B7C9;
    --card-bg: #12314F;
    --card-border: #1E4468;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
    color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  header {
    padding: 28px 32px 10px;
    border-bottom: 1px solid var(--card-border);
  }
  header .eyebrow {
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
    margin: 0 0 6px;
    font-weight: 600;
  }
  header h1 {
    margin: 0 0 18px;
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  main {
    padding: 28px 32px 40px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 18px;
    max-width: 1100px;
  }
  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-decoration: none;
    color: var(--ink);
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 26px 16px;
    min-height: 168px;
    transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
  }
  .card:hover, .card:focus-visible {
    transform: translateY(-2px);
    border-color: var(--gold);
    background: #15385C;
  }
  .card:active {
    transform: translateY(0);
  }
  .card-icon {
    width: 64px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #FFFFFF;
    border-radius: 10px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .card-icon img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  .card-name {
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-align: center;
    line-height: 1.35;
    color: var(--ink);
  }
  footer {
    padding: 10px 32px 26px;
    color: var(--ink-muted);
    font-size: 12px;
  }
</style>
</head>
